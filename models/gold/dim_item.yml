version: 2

models:
  - name: dim_item
    description: "Product dimension. Grain: one row per item_code. Always includes UNKNOWN_ITEM (price 0.00), added if the catalog does not supply it."
    columns:
      - name: item_code
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: item_category
        description: "e.g. Beverage, Food, Merch, Unknown."
        data_tests: [not_null]
      - name: item_category_sub
        description: "e.g. Latte."
        data_tests: [not_null]
      - name: unit_price
        description: "Current catalog price, USD, DECIMAL(10,2)."
        data_tests: [not_null]
